# ==============================================================================
#  tmux configuration — Mike Hall (zdots / adots: ~/.config/tmux/tmux.conf)
#  Palette : Kanagawa Wave (Hokusai woodblock · canonical rebelot/kanagawa.nvim)
#  Styling : Harmonized with Powerlevel10k (p10k round capsules:  /  /  / )
#  Profile : AI-Agent Optimized (Claude Code, zclaude, Antigravity, local LLMs)
#  Rule    : Stateless by design — NO session-resurrection plugins (resurrect/continuum)
# ==============================================================================

# ------------------------------------------------------------------------------
# 0. Core Terminal Capabilities & Protocol Passthrough (AI Agent Fidelity)
# ------------------------------------------------------------------------------
# Modern 256-color & truecolor (RGB) support
set -g  default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,screen-256color:Tc"
set -ga terminal-features ",*:RGB"
set -ga terminal-features ",*:extkeys"
set -ga terminal-features ",*:usstyle"
set -ga terminal-features ",*:cstyle"

# Undercurl support (diagnostics & lints in Neovim / agent TUIs)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# OSC Passthrough (vital for zclaude iTerm2 badges, notifications, and graphics)
set -g  allow-passthrough on

# OSC 52 Clipboard integration (agents and remote sessions can write to host clipboard)
set -s  set-clipboard on

# Zero escape delay (vital for modal editing & instant agent keystroke processing)
set -s  escape-time 0

# Extended keys reporting (passes modified keys like Shift-Enter, Ctrl-Enter to agent TUIs)
set -g  extended-keys on

# Focus events (notifies Neovim, TUIs, and agent runtimes when pane gains/loses focus)
set -g  focus-events on

# Deep scrollback buffer for retaining large agent reasoning traces and build logs
set -g  history-limit 100000

# Milliseconds for tmux status/alert messages
set -g  display-time 4000
set -g  display-panes-time 3000

# Status refresh interval (seconds)
set -g  status-interval 3

# Mouse support (pane switching, resizing, wheel scrolling without breaking Option-click)
set -g  mouse on

# ------------------------------------------------------------------------------
# 1. Ergonomic Navigation & Agent-Safe Indexing
# ------------------------------------------------------------------------------
# Ergonomic prefix: C-a (consistent with Emacs / zdots ergonomic flow)
set -g  prefix C-a
unbind  C-b
bind    C-a send-prefix

# 1-based indexing for windows and panes (intuitive targeting for agents & humans alike)
set -g  base-index 1
setw -g pane-base-index 1
set -g  renumber-windows on

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing with H, J, K, L (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Emacs-style copy mode (honors user profile preference)
setw -g mode-keys emacs

# Window and split creation: always preserve current working directory
bind c   new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind -   split-window -v -c "#{pane_current_path}"
bind |   split-window -h -c "#{pane_current_path}"

# Toggle pane synchronization with explicit operator feedback and status warning
bind S setw synchronize-panes \; display-message "Synchronize panes: #{?pane_synchronized,ON (⚠️ broadcast active!),OFF}"

# Reload config (prefix R)
bind R source-file "$HOME/.config/tmux/tmux.conf" \; display-message "✓ tmux.conf reloaded (Kanagawa Wave · p10k harmonized)"

# ------------------------------------------------------------------------------
# 2. AI Agent Workflows, Inspection & Lossless Buffer Capture
# ------------------------------------------------------------------------------
# Lossless full buffer dump: flattens entire pane history directly to system clipboard
# (ideal for passing comprehensive build/compiler/agent context to an LLM)
bind Y run-shell -b 'tmux capture-pane -p -J -S - | pbcopy && tmux display-message "📋 Entire pane history copied to clipboard (lossless)"'

# Recent context capture: grabs the last 500 lines of scrollback to clipboard
bind M-y run-shell -b 'tmux capture-pane -p -J -S -500 | pbcopy && tmux display-message "📋 Last 500 lines copied to clipboard"'

# Inspect scrollback buffer in Neovim quickfix/scratch buffer inside a floating modal popup
bind D display-popup -E -w 92% -h 88% "tmux capture-pane -p -J -S - | nvim -c 'setlocal buftype=nofile bufhidden=wipe ft=log' -"

# Interactive zclaude maintenance session
bind C new-window -c "#{pane_current_path}" -n zclaude 'zclaude'

# Headless platform-sync review popup
bind P display-popup -E -w 85% -h 85% 'zclaude --sync'

# Fast ad-hoc AI query popup in the current working directory
bind A display-popup -E -w 85% -h 85% -d "#{pane_current_path}" 'zdots-ask'

# Fast token burn & agent health telemetry popup
bind B display-popup -E -w 80% -h 75% 'cc-burn-watch 2>/dev/null || cc-doctor 2>/dev/null || ccusage 2>/dev/null || true'

# ------------------------------------------------------------------------------
# 3. Kanagawa Wave Palette Tokens (Canonical rebelot/kanagawa.nvim + zdots tune)
# ------------------------------------------------------------------------------
#  sumiInk0:     #16161D  (deepest ink / high contrast)
#  sumiInk3:     #1A1B2F  (ground / bg tuned bluer per zdots styleguide)
#  sumiInk4:     #2A2A37  (raised surface / active pills / status inactive)
#  sumiInk5:     #363646  (subtle border / inactive pane border)
#  sumiInk6:     #54546D  (hairlines / dividers)
#  waveBlue1:    #223249  (panels / intermediate contrast)
#  waveBlue2:    #2D4F67  (selection bg / active window highlight)
#  fujiWhite:    #DCD7BA  (foreground text)
#  fujiGray:     #727169  (muted text / index indicators)
#  oldWhite:     #C8C093  (AA-safe readable muted text)
#  crystalBlue:  #7E9CD8  (the wave accent / active highlights / session badge)
#  springBlue:   #7FB4CA  (bright wave blue / links)
#  waveAqua1:    #6A9589  (calm cyan / date)
#  waveAqua2:    #7AA89F  (bright cyan / command titles)
#  springGreen:  #98BB6C  (success / additions / copy mode badge)
#  autumnGreen:  #76946A  (ansi green)
#  carpYellow:   #E6C384  (carp yellow / active window / prefix highlight)
#  boatYellow2:  #C0A36E  (ansi yellow / warm gold)
#  surimiOrange: #FFA066  (numbers / options / prefix badge / zoomed indicator)
#  oniViolet:    #957FB8  (keywords / agent titles / active pane border / clock)
#  autumnRed:    #C34043  (error / deletions / sync-panes loud alert)

# ------------------------------------------------------------------------------
# 4. Status Bar Architecture — Harmonized with Powerlevel10k Round Capsules
# ------------------------------------------------------------------------------
# Note: Format conditionals #{?cond,true,false} use commas as branch delimiters.
# Style tokens inside conditionals MUST use separate blocks (e.g. #[fg=X]#[bg=Y]#[bold])
# with NO internal commas to guarantee clean parsing across all tmux versions.

set -g status "on"
set -g status-position bottom
set -g status-style "bg=#1A1B2F,fg=#DCD7BA"
set -g status-left-length 80
set -g status-right-length 160

# Status Left:
# [󰌌 Session] [󰘳 PREFIX]? [󰆏 COPY]? [󰓦 SYNC ⚠️]?
set -g status-left "\
#[fg=#7E9CD8]#[bg=#1A1B2F]\
#[fg=#16161D]#[bg=#7E9CD8]#[bold]󰌌 #S\
#[fg=#7E9CD8]#[bg=#1A1B2F]#[nobold]\
#{?client_prefix, #[fg=#FFA066]#[bg=#1A1B2F]#[fg=#16161D]#[bg=#FFA066]#[bold]󰘳 PREFIX#[fg=#FFA066]#[bg=#1A1B2F]#[nobold],}\
#{?pane_in_mode, #[fg=#98BB6C]#[bg=#1A1B2F]#[fg=#16161D]#[bg=#98BB6C]#[bold]󰆏 COPY#[fg=#98BB6C]#[bg=#1A1B2F]#[nobold],}\
#{?synchronize_panes, #[fg=#C34043]#[bg=#1A1B2F]#[fg=#16161D]#[bg=#C34043]#[bold]󰓦 SYNC ⚠️#[fg=#C34043]#[bg=#1A1B2F]#[nobold],} "

# Window Status Formatting: Distinct round capsules separated by space
setw -g window-status-separator " "

# Inactive Window:  #I #W[flags] 
setw -g window-status-format "\
#[fg=#2A2A37]#[bg=#1A1B2F]\
#[fg=#727169]#[bg=#2A2A37]#I \
#[fg=#C8C093]#[bg=#2A2A37]#W\
#{?window_flags,#[fg=#727169]#{window_flags},}\
#[fg=#2A2A37]#[bg=#1A1B2F]"

# Active Window: Two-tone p10k capsule  #I  #W [󰍉]? 
setw -g window-status-current-format "\
#[fg=#E6C384]#[bg=#1A1B2F]\
#[fg=#16161D]#[bg=#E6C384]#[bold]#I\
#[fg=#E6C384]#[bg=#2D4F67]\
#[fg=#DCD7BA]#[bg=#2D4F67]#[bold] #W\
#{?window_zoomed_flag, #[fg=#FFA066]󰍉,}\
#[fg=#2D4F67]#[bg=#1A1B2F]#[nobold] "

# Status Right: P10k round segmented capsule (Command -> Date -> Time)
set -g status-right "\
#[fg=#2A2A37]#[bg=#1A1B2F]\
#[fg=#7AA89F]#[bg=#2A2A37]󰆍 #{pane_current_command} \
#[fg=#223249]#[bg=#2A2A37]\
#[fg=#6A9589]#[bg=#223249]󰸗 %Y-%m-%d \
#[fg=#957FB8]#[bg=#223249]\
#[fg=#16161D]#[bg=#957FB8]#[bold]󰥔 %H:%M\
#[fg=#957FB8]#[bg=#1A1B2F]#[nobold]"

# ------------------------------------------------------------------------------
# 5. Pane Borders, Titles & Agent Observability
# ------------------------------------------------------------------------------
# Border styling: inactive subtle sumiInk5, active glowing oniViolet
set -g pane-border-style "fg=#363646,bg=default"
set -g pane-active-border-style "fg=#957FB8,bg=default"

# Pane border status: top banner with pane title, active command, path, and zoom
set -g pane-border-status top
set -g pane-border-format "\
 #[fg=#727169]#{pane_index} \
#[fg=#957FB8]#[bold]#{?pane_title,#{pane_title},#{pane_current_command}}#[default] \
#[fg=#54546D]│#[default] \
#[fg=#7AA89F]#{b:pane_current_path}\
#{?window_zoomed_flag, #[fg=#FFA066]#[bold]󰍉 ZOOMED,} "

# ------------------------------------------------------------------------------
# 6. Popups, Dialogs, Messages & Mode Highlights
# ------------------------------------------------------------------------------
# Popup window aesthetics (floating scratchpads, reviews, logs)
set -g popup-border-style "fg=#7E9CD8,bg=#1A1B2F"
set -g popup-border-lines rounded
set -g popup-style "bg=#1A1B2F"

# tmux command prompts and message bars
set -g message-style "bg=#2A2A37,fg=#7AA89F,bold"
set -g message-command-style "bg=#223249,fg=#DCD7BA,bold"

# Copy-mode selection highlighting (waveBlue2 selection with bold fujiWhite)
set -g mode-style "bg=#2D4F67,fg=#DCD7BA,bold"

# Clock mode (crystalBlue accent)
set -g clock-mode-colour "#7E9CD8"
set -g clock-mode-style 24

# Pane number display colors (prefix + q)
set -g display-panes-colour "#2A2A37"
set -g display-panes-active-colour "#7E9CD8"

# ------------------------------------------------------------------------------
# 7. Plugins (TPM) — STATELESS ONLY (no resurrect/continuum by design)
# ------------------------------------------------------------------------------
#   tmux-sensible        sane cross-platform defaults
#   tmux-yank            copy selection to system clipboard
#   extrakto             prefix+Tab: fzf-extract paths/hashes/urls/words from pane
#   tmux-fzf             prefix+F: fuzzy switch sessions/windows/panes/commands
#   tmux-open            copy-mode 'o' opens file/url, 'C-o' opens in $EDITOR
#   tmux-prefix-highlight status indicator when the prefix / copy mode is active
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Plugin tuning
set -g @extrakto_key 'tab'
set -g @extrakto_fzf_tool 'fzf'
set -g @extrakto_fzf_layout 'reverse'
set -g @extrakto_clip_tool 'pbcopy'

set -g @tmux-fzf-launch-key 'F'

set -g @yank_action 'copy-pipe'
set -g @yank_with_mouse on

# Prefix highlight theme matching Kanagawa Wave
set -g @prefix_highlight_fg '#16161D'
set -g @prefix_highlight_bg '#FFA066'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=#16161D,bg=#98BB6C,bold'
set -g @prefix_highlight_show_sync_mode 'on'
set -g @prefix_highlight_sync_mode_attr 'fg=#16161D,bg=#C34043,bold'

# ------------------------------------------------------------------------------
# 8. TPM Bootstrap & Initialization (MUST remain at bottom of file)
# ------------------------------------------------------------------------------
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone -q https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
run '~/.config/tmux/plugins/tpm/tpm'
