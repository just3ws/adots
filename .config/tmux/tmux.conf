# tmux configuration - Mike  (XDG: $XDG_CONFIG_HOME/tmux/tmux.conf)
# High-signal Kanagawa (Wave) styling + Emacs awareness + Claude Code / zclaude.
# Stateless by design — NO session-resurrection plugins (resurrect/continuum).

# 0. Core Settings
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -s escape-time 0
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5

# 1. Keybindings
# Use C-a as prefix (more Emacs-like/ergonomic)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Emacs-style copy mode
setw -g mode-keys emacs

# Reload config (prefix R)
bind R source-file "$HOME/.config/tmux/tmux.conf" \; display-message "tmux.conf reloaded"

# 2. Kanagawa (Wave) Theme Integration
# Sumi Ink3 (bg):    #1F1F28
# Sumi Ink4 (sel):   #2A2A37
# Fuji White (fg):   #DCD7BA
# Fuji Gray (muted): #727169
# Wave Aqua1 (cyan): #6A9589
# Spring Green:      #98BB6C
# Surimi Orange:     #FFA066
# Oni Violet:        #957FB8
# Carp Yellow:       #E6C384

set -g status-style bg='#1F1F28',fg='#DCD7BA'
set -g status-left '#[bg=#DCD7BA,fg=#1F1F28,bold] #S '
set -g status-right '#{prefix_highlight}#[fg=#6A9589,bg=#2A2A37] %Y-%m-%d #[fg=#DCD7BA,bg=#727169] %H:%M '
set -g window-status-current-style bg='#2A2A37',fg='#E6C384',bold
set -g pane-border-style fg='#2A2A37'
set -g pane-active-border-style fg='#957FB8'
set -g message-style bg='#2A2A37',fg='#6A9589'

# 3. Claude Code / zclaude integration
# Truecolor + passthrough so the Claude Code TUI renders correctly and `zclaude`
# can set the iTerm2 badge through tmux (OSC 1337 needs allow-passthrough).
set -ga terminal-features ",*:RGB"
set -g  allow-passthrough on
set -g  focus-events on
# Mouse: scroll the Claude Code scrollback + click-select panes. (In iTerm2 hold
# Option for native text selection while mouse mode is on.)
set -g  mouse on

# Pane titles — zclaude sets these via `select-pane -T` ("zclaude:mode/model").
set -g  pane-border-status top
set -g  pane-border-format ' #{pane_index} #[fg=#957FB8]#{pane_title}#[default] #{pane_current_command} '

# Quick launchers (prefix C-a then…):
#   C  new window running an interactive zclaude maintenance session
#   P  popup running the zclaude --sync four-repo platform review
bind C new-window -n zclaude 'zclaude'
bind P display-popup -E -w 85% -h 85% 'zclaude --sync'

# 4. Plugins (TPM) — STATELESS only; no resurrect/continuum by design.
#   tmux-sensible        sane cross-platform defaults
#   tmux-yank            copy selection to the system clipboard (grab CC output)
#   extrakto             prefix+Tab: fzf-extract paths/hashes/urls/words from pane
#   tmux-fzf             prefix+F: fuzzy switch sessions/windows/panes/commands
#   tmux-open            copy-mode 'o' opens file/url, 'C-o' opens in $EDITOR
#   tmux-prefix-highlight status indicator when the prefix / copy mode is active
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Plugin tuning
set -g @extrakto_key 'tab'
set -g @prefix_highlight_fg '#1F1F28'
set -g @prefix_highlight_bg '#FFA066'
set -g @prefix_highlight_show_copy_mode 'on'
set -g @prefix_highlight_copy_mode_attr 'fg=#1F1F28,bg=#98BB6C'

# Bootstrap TPM on first run, then load it. The `run tpm` line MUST stay last.
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone -q https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
run '~/.config/tmux/plugins/tpm/tpm'
