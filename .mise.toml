# adots guard file.
#
# Keep this file free of [tools] pins. The canonical user-level mise config is:
#
#   ~/.config/mise/config.toml
#
# zdots owns shell activation, Homebrew installation, and repo-local runtime
# pins in ~/.config/zsh/mise.toml. adots owns the user-level mise policy that
# makes those runtimes useful from a restored home directory.
